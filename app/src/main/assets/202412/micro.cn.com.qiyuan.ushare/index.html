    <style>
      html,
      body,
      div,
      span,
      applet,
      button,
      select,
      section,
      input,
      object,
      iframe,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      p,
      blockquote,
      pre,
      a,
      abbr,
      acronym,
      address,
      big,
      cite,
      code,
      del,
      dfn,
      em,
      img,
      ins,
      kbd,
      q,
      s,
      samp,
      small,
      strike,
      strong,
      sub,
      sup,
      tt,
      var,
      dl,
      dt,
      dd,
      ol,
      ul,
      li,
      fieldset,
      form,
      label,
      legend,
      table,
      caption,
      tbody,
      tfoot,
      thead,
      tr,
      th,
      td {
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        padding: 0;
        border: 0;
        outline: 0;
        font-style: inherit;
        font-size: 100%;
        vertical-align: baseline;
        box-sizing: border-box;
        border: none;
        -webkit-text-size-adjust: none;
        -moz-text-size-adjust: none;
        -ms-text-size-adjust: none;
        text-size-adjust: none;
      }
      body {
        color: #000;
        background: #fff;
        -webkit-text-size-adjust: none;
        -moz-text-size-adjust: none;
        -ms-text-size-adjust: none;
        text-size-adjust: none;
      }
      ol,
      ul,
      li,
      ol {
        list-style: none;
      }
      table {
        border-collapse: separate;
        border-spacing: 0;
        vertical-align: middle;
      }
      caption,
      th,
      td {
        text-align: left;
        font-weight: normal;
        vertical-align: middle;
      }
      a img {
        border: none;
      }
      * {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        box-sizing: border-box;
      }
      input {
        -webkit-user-select: auto;
      }
      @media (orientation: landscape) {
        html.ipad.ios7 > body {
          position: fixed;
          bottom: 0;
          width: 100%;
          height: 672px !important;
        }
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      .pswp__top-bar {
        top: 30px !important;
      }
      video:fullscreen {
        object-fit: contain !important;
      }
      .amap-logo {
        display: none !important;
        opacity: 0 !important;
      }
      .amap-copyright {
        opacity: 0;
      }
      .amap-container {
        background-color: transparent !important;
      }
    </style>
